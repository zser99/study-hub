<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 직접 생성 vs 스프링 DI</text>

  <!-- Left panel: 기존 방식 -->
  <text x="220" y="65" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">기존 방식 (직접 생성)</text>
  <rect x="90" y="90" width="260" height="60" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="220" y="125" text-anchor="middle" font-size="14" fill="#c0392b">OrderService</text>
  <line x1="220" y1="150" x2="220" y2="200" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="245" y="180" font-size="12" fill="#c0392b">new</text>
  <rect x="90" y="200" width="260" height="60" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="220" y="235" text-anchor="middle" font-size="14" fill="#c0392b">FixedDiscountPolicy</text>
  <text x="220" y="295" text-anchor="middle" font-size="12.5" fill="#555">OrderService가 구현체를</text>
  <text x="220" y="313" text-anchor="middle" font-size="12.5" fill="#555">직접 알고, 직접 생성한다</text>

  <!-- divider -->
  <line x1="450" y1="60" x2="450" y2="340" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Right panel: DI -->
  <text x="670" y="65" text-anchor="middle" font-size="15" font-weight="700" fill="#1a73a8">스프링 DI 방식</text>
  <rect x="560" y="150" width="220" height="55" rx="10" fill="#e8f1fb" stroke="#1a73a8" stroke-width="1.5"/>
  <text x="670" y="183" text-anchor="middle" font-size="14" fill="#1a73a8">스프링 컨테이너</text>

  <rect x="540" y="240" width="120" height="55" rx="10" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="600" y="273" text-anchor="middle" font-size="13" fill="#2e7d32">OrderService</text>

  <rect x="680" y="240" width="150" height="55" rx="10" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="755" y="266" text-anchor="middle" font-size="12.5" fill="#2e7d32">RateDiscountPolicy</text>
  <text x="755" y="282" text-anchor="middle" font-size="11" fill="#2e7d32">(구현체)</text>

  <line x1="640" y1="205" x2="600" y2="240" stroke="#1a73a8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="700" y1="205" x2="740" y2="240" stroke="#1a73a8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="600" y="225" font-size="12" fill="#1a73a8">생성</text>
  <text x="720" y="225" font-size="12" fill="#1a73a8">생성 + 주입</text>

  <text x="670" y="330" text-anchor="middle" font-size="12.5" fill="#555">컨테이너가 구현체를 만들고</text>
  <text x="670" y="348" text-anchor="middle" font-size="12.5" fill="#555">OrderService에 주입해준다</text>

  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a73a8"/>
    </marker>
  </defs>
</svg>
