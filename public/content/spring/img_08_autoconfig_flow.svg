<svg viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="880" height="320" fill="#ffffff"/>
  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 자동 설정 조건 판단 흐름</text>

  <rect x="30" y="70" width="180" height="55" rx="10" fill="#333"/>
  <text x="120" y="102" text-anchor="middle" font-size="12.5" fill="#fff">자동 설정 후보 목록 로딩</text>

  <polygon points="290,60 400,60 440,97 400,134 290,134 250,97" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="345" y="92" text-anchor="middle" font-size="11.5" fill="#8a6d00">클래스패스에</text>
  <text x="345" y="108" text-anchor="middle" font-size="11.5" fill="#8a6d00">대상 클래스 있나?</text>

  <rect x="470" y="30" width="180" height="50" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="560" y="60" text-anchor="middle" font-size="12" fill="#c0392b">No → 이 설정 통째로 무시</text>

  <polygon points="480,130 610,130 650,167 610,204 480,204 440,167" fill="#f3e8fb" stroke="#7b3fa0" stroke-width="1.5"/>
  <text x="545" y="160" text-anchor="middle" font-size="11.5" fill="#7b3fa0">이미 등록된</text>
  <text x="545" y="176" text-anchor="middle" font-size="11.5" fill="#7b3fa0">빈이 있나?</text>

  <rect x="690" y="105" width="170" height="50" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="775" y="126" text-anchor="middle" font-size="12" fill="#c0392b">Yes → 자동 설정은</text>
  <text x="775" y="143" text-anchor="middle" font-size="12" fill="#c0392b">조용히 물러남</text>

  <rect x="510" y="230" width="200" height="55" rx="10" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="610" y="255" text-anchor="middle" font-size="12.5" fill="#2e7d32">No → 자동으로</text>
  <text x="610" y="272" text-anchor="middle" font-size="12.5" fill="#2e7d32">기본 빈 등록</text>

  <g stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arrow8)">
    <line x1="210" y1="97" x2="245" y2="97"/>
    <line x1="345" y1="60" x2="440" y2="55"/>
    <line x1="345" y1="134" x2="450" y2="160"/>
    <line x1="650" y1="150" x2="685" y2="135"/>
    <line x1="545" y1="204" x2="590" y2="228"/>
  </g>
  <text x="380" y="45" font-size="11" fill="#888">@ConditionalOnClass</text>
  <text x="400" y="195" font-size="11" fill="#888">@ConditionalOnMissingBean</text>

  <text x="440" y="300" text-anchor="middle" font-size="12.5" fill="#555">"자동으로 해준다" = 개발자가 아무것도 안 했을 때만 대신 채워주는 안전망</text>

  <defs>
    <marker id="arrow8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
