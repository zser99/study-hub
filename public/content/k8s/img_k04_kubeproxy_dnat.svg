<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrowDn" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="820" height="340" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 2. kube-proxy의 DNAT — ClusterIP에서 Pod IP로</text>

  <rect x="40" y="70" width="150" height="50" rx="6" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="115" y="100" text-anchor="middle" font-size="10.5" fill="#2e7d32">클라이언트 Pod</text>

  <rect x="290" y="70" width="220" height="70" rx="8" fill="#e8f1fb" stroke="#1a73a8" stroke-width="1.5"/>
  <text x="400" y="95" text-anchor="middle" font-size="10.5" fill="#1a73a8" font-weight="700">목적지: 10.96.0.5:80</text>
  <text x="400" y="113" text-anchor="middle" font-size="9" fill="#1a73a8">(Service ClusterIP — 가상 IP)</text>
  <text x="400" y="129" text-anchor="middle" font-size="8.5" fill="#1a73a8">실제 인터페이스엔 존재하지 않음</text>

  <line x1="190" y1="95" x2="286" y2="105" stroke="#555" stroke-width="1.6" marker-end="url(#arrowDn)"/>

  <rect x="290" y="170" width="220" height="80" rx="8" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="400" y="195" text-anchor="middle" font-size="10.5" fill="#8a6d00" font-weight="700">kube-proxy 규칙</text>
  <text x="400" y="215" text-anchor="middle" font-size="9" fill="#8a6d00">(iptables / IPVS / nftables)</text>
  <text x="400" y="233" text-anchor="middle" font-size="9" fill="#8a6d00">목적지를 실제 Pod IP로 재작성</text>

  <line x1="400" y1="140" x2="400" y2="166" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrowDn)"/>

  <rect x="600" y="180" width="180" height="60" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="690" y="205" text-anchor="middle" font-size="10" fill="#c0392b">최종 목적지:</text>
  <text x="690" y="223" text-anchor="middle" font-size="10" fill="#c0392b">10.244.1.5:8080 (실제 Pod)</text>

  <line x1="510" y1="210" x2="596" y2="210" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrowDn)"/>

  <rect x="130" y="260" width="560" height="60" rx="6" fill="#f9f9f9" stroke="#ccc"/>
  <text x="410" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="700">클라이언트는 항상 같은 ClusterIP로 요청 — 실제 Pod가 바뀌어도 모른다</text>
  <text x="410" y="304" text-anchor="middle" font-size="10" fill="#555">이 재작성은 커널 레벨에서 일어나며, 애플리케이션 코드는 전혀 관여하지 않는다</text>
</svg>
