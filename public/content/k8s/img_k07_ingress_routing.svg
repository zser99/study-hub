<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrowIr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="820" height="340" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. Ingress의 host/path 기반 라우팅</text>

  <rect x="40" y="60" width="140" height="50" rx="6" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="110" y="90" text-anchor="middle" font-size="10.5" fill="#2e7d32">외부 클라이언트</text>

  <rect x="290" y="60" width="240" height="90" rx="8" fill="#e8f1fb" stroke="#1a73a8" stroke-width="1.5"/>
  <text x="410" y="85" text-anchor="middle" font-size="11" fill="#1a73a8" font-weight="700">Ingress (외부 로드밸런서 하나)</text>
  <text x="410" y="105" text-anchor="middle" font-size="8.5" fill="#1a73a8">host: example.com, path: /api → api-svc</text>
  <text x="410" y="120" text-anchor="middle" font-size="8.5" fill="#1a73a8">host: example.com, path: /web → web-svc</text>
  <text x="410" y="135" text-anchor="middle" font-size="8.5" fill="#1a73a8">host: blog.example.com → blog-svc</text>

  <line x1="180" y1="85" x2="286" y2="100" stroke="#555" stroke-width="1.6" marker-end="url(#arrowIr)"/>

  <rect x="600" y="55" width="160" height="40" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="680" y="79" text-anchor="middle" font-size="9.5" fill="#c0392b">Service: api-svc</text>

  <rect x="600" y="105" width="160" height="40" rx="6" fill="#fff7e6" stroke="#b8860b"/>
  <text x="680" y="129" text-anchor="middle" font-size="9.5" fill="#8a6d00">Service: web-svc</text>

  <rect x="600" y="155" width="160" height="40" rx="6" fill="#f3e8fb" stroke="#7b3fa0"/>
  <text x="680" y="179" text-anchor="middle" font-size="9.5" fill="#7b3fa0">Service: blog-svc</text>

  <line x1="530" y1="80" x2="596" y2="75" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrowIr)"/>
  <line x1="530" y1="105" x2="596" y2="120" stroke="#b8860b" stroke-width="1.4" marker-end="url(#arrowIr)"/>
  <line x1="530" y1="135" x2="596" y2="170" stroke="#7b3fa0" stroke-width="1.4" marker-end="url(#arrowIr)"/>

  <rect x="150" y="240" width="520" height="70" rx="8" fill="#f9f9f9" stroke="#ccc"/>
  <text x="410" y="265" text-anchor="middle" font-size="11" fill="#333" font-weight="700">Service(L4)라면 로드밸런서 3개가 필요했을 상황</text>
  <text x="410" y="288" text-anchor="middle" font-size="10" fill="#555">Ingress(L7)는 하나의 진입점에서 HTTP 요청 내용을 보고 나눠 보낸다</text>

  <text x="410" y="330" text-anchor="middle" font-size="11" fill="#777">Service(L4)는 IP·포트만, Ingress(L7)는 호스트·경로까지 본다</text>
</svg>
