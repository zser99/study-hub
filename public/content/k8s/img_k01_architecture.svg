<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="860" height="400" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 쿠버네티스 클러스터 아키텍처</text>

  <text x="220" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a73a8">컨트롤 플레인</text>
  <rect x="40" y="65" width="360" height="230" rx="8" fill="#e8f1fb" stroke="#1a73a8" stroke-width="1.5"/>

  <rect x="60" y="82" width="150" height="42" rx="5" fill="#fff" stroke="#1a73a8"/>
  <text x="135" y="107" text-anchor="middle" font-size="10" fill="#1a73a8">kube-apiserver</text>

  <rect x="230" y="82" width="150" height="42" rx="5" fill="#fff" stroke="#1a73a8"/>
  <text x="305" y="107" text-anchor="middle" font-size="10" fill="#1a73a8">etcd</text>

  <rect x="60" y="140" width="150" height="42" rx="5" fill="#fff" stroke="#1a73a8"/>
  <text x="135" y="165" text-anchor="middle" font-size="10" fill="#1a73a8">kube-scheduler</text>

  <rect x="230" y="140" width="150" height="42" rx="5" fill="#fff" stroke="#1a73a8"/>
  <text x="305" y="160" text-anchor="middle" font-size="9.5" fill="#1a73a8">kube-controller</text>
  <text x="305" y="172" text-anchor="middle" font-size="9.5" fill="#1a73a8">-manager</text>

  <rect x="145" y="198" width="150" height="42" rx="5" fill="#fff7e6" stroke="#b8860b"/>
  <text x="220" y="218" text-anchor="middle" font-size="9.5" fill="#8a6d00">cloud-controller</text>
  <text x="220" y="230" text-anchor="middle" font-size="9.5" fill="#8a6d00">-manager (선택)</text>

  <text x="220" y="272" text-anchor="middle" font-size="9.5" fill="#1a73a8">모든 요청은 kube-apiserver를 거쳐</text>
  <text x="220" y="288" text-anchor="middle" font-size="9.5" fill="#1a73a8">etcd에 상태를 읽고 쓴다</text>

  <text x="640" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">워커 노드 (여러 대)</text>
  <rect x="460" y="65" width="360" height="230" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>

  <rect x="480" y="82" width="150" height="42" rx="5" fill="#fff" stroke="#2e7d32"/>
  <text x="555" y="107" text-anchor="middle" font-size="10" fill="#2e7d32">kubelet</text>

  <rect x="650" y="82" width="150" height="42" rx="5" fill="#fff" stroke="#2e7d32"/>
  <text x="725" y="107" text-anchor="middle" font-size="10" fill="#2e7d32">kube-proxy</text>

  <rect x="480" y="140" width="320" height="42" rx="5" fill="#fff" stroke="#2e7d32"/>
  <text x="640" y="165" text-anchor="middle" font-size="10" fill="#2e7d32">컨테이너 런타임 (containerd 등)</text>

  <rect x="480" y="198" width="90" height="42" rx="5" fill="#f3e8fb" stroke="#7b3fa0"/>
  <text x="525" y="223" text-anchor="middle" font-size="9" fill="#7b3fa0">Pod</text>
  <rect x="585" y="198" width="90" height="42" rx="5" fill="#f3e8fb" stroke="#7b3fa0"/>
  <text x="630" y="223" text-anchor="middle" font-size="9" fill="#7b3fa0">Pod</text>
  <rect x="690" y="198" width="90" height="42" rx="5" fill="#f3e8fb" stroke="#7b3fa0"/>
  <text x="735" y="223" text-anchor="middle" font-size="9" fill="#7b3fa0">Pod</text>

  <text x="640" y="272" text-anchor="middle" font-size="9.5" fill="#2e7d32">kubelet이 Pod 실행을 보장,</text>
  <text x="640" y="288" text-anchor="middle" font-size="9.5" fill="#2e7d32">kube-proxy가 Service 네트워크 규칙 구현</text>

  <line x1="400" y1="180" x2="460" y2="180" stroke="#555" stroke-width="1.8"/>
  <text x="430" y="170" text-anchor="middle" font-size="9" fill="#555">API 통신</text>

  <text x="430" y="335" text-anchor="middle" font-size="12" fill="#555">여러 워커 노드가 하나의 컨트롤 플레인에 연결되어 클러스터를 이룬다</text>
  <text x="430" y="357" text-anchor="middle" font-size="11" fill="#777">각 노드는 여러 개의 Pod를 실행할 수 있다</text>
</svg>
