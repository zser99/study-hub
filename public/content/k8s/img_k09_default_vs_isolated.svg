<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrowNp" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="820" height="340" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 기본(비격리) vs NetworkPolicy 적용(격리)</text>

  <text x="200" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">기본 상태 — 완전 개방</text>
  <rect x="60" y="65" width="280" height="180" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="90" y="90" width="70" height="40" fill="#fff" stroke="#2e7d32"/><text x="125" y="114" text-anchor="middle" font-size="8.5" fill="#2e7d32">결제</text>
  <rect x="200" y="90" width="70" height="40" fill="#fff" stroke="#2e7d32"/><text x="235" y="114" text-anchor="middle" font-size="8.5" fill="#2e7d32">로그</text>
  <rect x="90" y="160" width="70" height="40" fill="#fff" stroke="#2e7d32"/><text x="125" y="184" text-anchor="middle" font-size="8.5" fill="#2e7d32">주문</text>
  <rect x="200" y="160" width="70" height="40" fill="#fff" stroke="#2e7d32"/><text x="235" y="184" text-anchor="middle" font-size="8.5" fill="#2e7d32">아무Pod</text>
  <line x1="160" y1="110" x2="200" y2="110" stroke="#2e7d32" stroke-width="1.3"/>
  <line x1="125" y1="130" x2="125" y2="160" stroke="#2e7d32" stroke-width="1.3"/>
  <line x1="160" y1="180" x2="200" y2="180" stroke="#2e7d32" stroke-width="1.3"/>
  <line x1="235" y1="130" x2="235" y2="160" stroke="#2e7d32" stroke-width="1.3"/>
  <line x1="160" y1="110" x2="235" y2="160" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="200" y="235" text-anchor="middle" font-size="9.5" fill="#2e7d32">모든 Pod가 서로 자유롭게 통신</text>

  <text x="620" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Policy 적용 — 격리(default-deny)</text>
  <rect x="480" y="65" width="280" height="180" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="510" y="90" width="70" height="40" fill="#fff" stroke="#c0392b"/><text x="545" y="114" text-anchor="middle" font-size="8.5" fill="#c0392b">결제</text>
  <rect x="620" y="90" width="70" height="40" fill="#fff" stroke="#999" stroke-dasharray="3,2"/><text x="655" y="114" text-anchor="middle" font-size="8.5" fill="#999">로그</text>
  <rect x="510" y="160" width="70" height="40" fill="#fff" stroke="#2e7d32"/><text x="545" y="184" text-anchor="middle" font-size="8.5" fill="#2e7d32">주문(허용)</text>
  <rect x="620" y="160" width="70" height="40" fill="#fff" stroke="#999" stroke-dasharray="3,2"/><text x="655" y="184" text-anchor="middle" font-size="8" fill="#999">아무Pod</text>
  <line x1="545" y1="130" x2="545" y2="160" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arrowNp)"/>
  <text x="590" y="115" font-size="14" fill="#c0392b">✕</text>
  <text x="590" y="185" font-size="14" fill="#c0392b">✕</text>
  <text x="620" y="235" text-anchor="middle" font-size="9.5" fill="#c0392b">허용된 것 외엔 모두 차단</text>

  <text x="410" y="290" text-anchor="middle" font-size="12" fill="#555">Policy를 하나라도 적용받는 순간, 그 Pod는 비격리 → 격리로 전환된다</text>
  <text x="410" y="312" text-anchor="middle" font-size="10.5" fill="#777">CNI가 NetworkPolicy를 지원하지 않으면 이 전환 자체가 일어나지 않는다</text>
</svg>
