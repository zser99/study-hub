<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrowPn" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1a73a8"/>
    </marker>
  </defs>
  <rect width="820" height="340" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. Pod의 네트워크 네임스페이스 공유</text>

  <text x="230" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#1a73a8">Pod A (IP: 10.244.1.5)</text>
  <rect x="60" y="65" width="340" height="170" rx="8" fill="#e8f1fb" stroke="#1a73a8" stroke-width="1.5"/>
  <text x="230" y="86" text-anchor="middle" font-size="9.5" fill="#1a73a8">네트워크 네임스페이스 (공유)</text>

  <rect x="80" y="100" width="140" height="60" rx="6" fill="#fff" stroke="#1a73a8"/>
  <text x="150" y="125" text-anchor="middle" font-size="9.5" fill="#1a73a8">컨테이너 1</text>
  <text x="150" y="143" text-anchor="middle" font-size="8.5" fill="#1a73a8">앱 서버 :8080</text>

  <rect x="240" y="100" width="140" height="60" rx="6" fill="#fff" stroke="#1a73a8"/>
  <text x="310" y="125" text-anchor="middle" font-size="9.5" fill="#1a73a8">컨테이너 2</text>
  <text x="310" y="143" text-anchor="middle" font-size="8.5" fill="#1a73a8">사이드카 :9090</text>

  <line x1="220" y1="130" x2="240" y2="130" stroke="#1a73a8" stroke-width="1.8" marker-end="url(#arrowPn)"/>
  <text x="230" y="118" text-anchor="middle" font-size="8" fill="#1a73a8">localhost</text>

  <text x="230" y="200" text-anchor="middle" font-size="9.5" fill="#1a73a8">Pod IP 하나를 공유, 포트로만 구분</text>

  <text x="600" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">Pod B (IP: 10.244.2.9)</text>
  <rect x="460" y="65" width="300" height="170" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="480" y="100" width="240" height="60" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="600" y="125" text-anchor="middle" font-size="9.5" fill="#2e7d32">컨테이너 1</text>
  <text x="600" y="143" text-anchor="middle" font-size="8.5" fill="#2e7d32">DB 클라이언트 :5000</text>

  <line x1="400" y1="150" x2="460" y2="150" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowPn)"/>
  <text x="430" y="175" text-anchor="middle" font-size="9" fill="#c0392b">NAT 없이 직접 통신</text>
  <text x="430" y="190" text-anchor="middle" font-size="8" fill="#c0392b">(Pod IP로 곧장)</text>

  <text x="410" y="270" text-anchor="middle" font-size="12" fill="#555">같은 Pod 안의 컨테이너는 localhost로, 서로 다른 Pod는 각자의 IP로 직접 통신</text>
  <text x="410" y="292" text-anchor="middle" font-size="11" fill="#777">같은 노드든 다른 노드든 이 규칙은 동일하게 적용된다</text>
</svg>
