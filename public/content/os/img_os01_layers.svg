<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="700" height="320" fill="#ffffff"/>
  <text x="350" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 운영체제의 위치</text>

  <rect x="150" y="50" width="400" height="55" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="350" y="83" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="700">응용 프로그램 (브라우저, 스프링 앱, ...)</text>

  <rect x="150" y="120" width="400" height="45" rx="8" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="350" y="148" text-anchor="middle" font-size="12.5" fill="#8a6d00">시스템 콜 인터페이스</text>

  <rect x="150" y="180" width="400" height="65" rx="8" fill="#e8f1fb" stroke="#1a73a8" stroke-width="1.7"/>
  <text x="350" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1a73a8">운영체제 커널</text>
  <text x="350" y="225" text-anchor="middle" font-size="11" fill="#1a73a8">프로세스·메모리·파일·네트워크 관리</text>

  <rect x="150" y="260" width="400" height="45" rx="8" fill="#333"/>
  <text x="350" y="288" text-anchor="middle" font-size="12.5" fill="#fff">하드웨어 (CPU, 메모리, 디스크, NIC)</text>

  <g stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrowO)" marker-start="url(#arrowO2)">
    <line x1="350" y1="105" x2="350" y2="118"/>
    <line x1="350" y1="165" x2="350" y2="178"/>
    <line x1="350" y1="245" x2="350" y2="258"/>
  </g>

  <defs>
    <marker id="arrowO" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#999"/>
    </marker>
    <marker id="arrowO2" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto">
      <path d="M0,8 L8,8 L4,0 Z" fill="#999"/>
    </marker>
  </defs>
</svg>
