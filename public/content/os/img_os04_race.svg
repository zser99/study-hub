<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="820" height="320" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 경쟁 상태 — count++ 가 한 번만 반영되는 순간</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#777">초기값 count = 0, 두 스레드가 각각 count++ 를 한 번씩 실행</text>

  <text x="40" y="90" font-size="12" font-weight="700" fill="#1a73a8">스레드 A</text>
  <rect x="120" y="72" width="130" height="30" rx="4" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="185" y="91" text-anchor="middle" font-size="10" fill="#1a73a8">읽기: count=0</text>
  <rect x="500" y="72" width="130" height="30" rx="4" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="565" y="91" text-anchor="middle" font-size="10" fill="#1a73a8">1 증가 → 쓰기: 1</text>

  <text x="40" y="150" font-size="12" font-weight="700" fill="#2e7d32">스레드 B</text>
  <rect x="280" y="132" width="130" height="30" rx="4" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="345" y="151" text-anchor="middle" font-size="10" fill="#2e7d32">읽기: count=0</text>
  <rect x="430" y="132" width="130" height="30" rx="4" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="495" y="151" text-anchor="middle" font-size="10" fill="#2e7d32">1 증가 → 쓰기: 1</text>

  <line x1="250" y1="87" x2="280" y2="147" stroke="#999" stroke-dasharray="3,3"/>
  <text x="260" y="120" font-size="9" fill="#999">컨텍스트 스위칭</text>

  <line x1="410" y1="147" x2="500" y2="87" stroke="#999" stroke-dasharray="3,3"/>
  <text x="430" y="115" font-size="9" fill="#999">다시 A로 스위칭</text>

  <rect x="120" y="210" width="510" height="50" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="375" y="232" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">결과: count = 1 (두 번 증가시켰는데 한 번만 반영됨)</text>
  <text x="375" y="250" text-anchor="middle" font-size="10.5" fill="#c0392b">B가 A의 "낡은" 값(0)을 기준으로 다시 써버렸기 때문</text>

  <text x="410" y="295" text-anchor="middle" font-size="12" fill="#555">임계 구역을 뮤텍스/세마포어로 보호하면 이런 겹침 자체가 불가능해진다</text>
</svg>
