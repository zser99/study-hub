<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="780" height="300" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 프로세스 상태 전이도</text>

  <circle cx="80" cy="150" r="38" fill="#f0f0f0" stroke="#666"/>
  <text x="80" y="155" text-anchor="middle" font-size="12" fill="#444">New</text>

  <circle cx="280" cy="150" r="42" fill="#fff7e6" stroke="#b8860b"/>
  <text x="280" y="155" text-anchor="middle" font-size="12" fill="#8a6d00">Ready</text>

  <circle cx="480" cy="150" r="42" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="480" y="155" text-anchor="middle" font-size="12" fill="#2e7d32">Running</text>

  <circle cx="480" cy="270" r="42" fill="#fdecea" stroke="#c0392b"/>
  <text x="480" y="275" text-anchor="middle" font-size="11" fill="#c0392b">Waiting</text>

  <circle cx="680" cy="150" r="38" fill="#eee" stroke="#666"/>
  <text x="680" y="155" text-anchor="middle" font-size="11" fill="#444">Terminated</text>

  <g stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrowSt)">
    <path d="M118,150 L238,150"/>
    <path d="M322,140 L438,140"/>
    <path d="M438,160 Q380,190 322,165" />
    <path d="M480,192 L480,228"/>
    <path d="M448,255 Q380,220 322,168"/>
    <path d="M522,150 L642,150"/>
  </g>
  <text x="180" y="140" text-anchor="middle" font-size="10" fill="#555">admit</text>
  <text x="380" y="132" text-anchor="middle" font-size="10" fill="#555">dispatch</text>
  <text x="380" y="205" text-anchor="middle" font-size="10" fill="#555">time-out</text>
  <text x="500" y="212" text-anchor="middle" font-size="10" fill="#555">I/O 요청</text>
  <text x="400" y="245" text-anchor="middle" font-size="10" fill="#555">I/O 완료</text>
  <text x="600" y="140" text-anchor="middle" font-size="10" fill="#555">exit</text>

  <defs>
    <marker id="arrowSt" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
