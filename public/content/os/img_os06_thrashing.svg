<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="780" height="320" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 2. 스래싱 — 멀티프로그래밍 정도와 CPU 활용률</text>

  <line x1="80" y1="250" x2="700" y2="250" stroke="#999" stroke-width="1.3"/>
  <line x1="80" y1="250" x2="80" y2="60" stroke="#999" stroke-width="1.3"/>
  <text x="45" y="65" font-size="10.5" fill="#555">CPU 활용률</text>
  <text x="650" y="270" font-size="10.5" fill="#555">멀티프로그래밍 정도</text>

  <path d="M80,240 L200,150 L320,85 L400,70 L460,110 L560,190 L680,235" fill="none" stroke="#1a73a8" stroke-width="2.4"/>
  <circle cx="400" cy="70" r="4.5" fill="#2e7d32"/>
  <text x="400" y="55" text-anchor="middle" font-size="10" fill="#2e7d32">최적 지점</text>

  <line x1="400" y1="70" x2="400" y2="250" stroke="#2e7d32" stroke-dasharray="4,4"/>

  <rect x="450" y="90" width="220" height="46" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="560" y="110" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="700">이 지점을 넘으면 스래싱 시작</text>
  <text x="560" y="126" text-anchor="middle" font-size="9.5" fill="#c0392b">프로세스를 더 넣을수록 활용률 급락</text>

  <text x="200" y="270" text-anchor="middle" font-size="9.5" fill="#555">프레임 여유 있음</text>
  <text x="560" y="270" text-anchor="middle" font-size="9.5" fill="#555">프레임 부족 → 폴트 폭증</text>

  <text x="390" y="300" text-anchor="middle" font-size="12" fill="#555">"프로세스를 많이 돌릴수록 CPU가 바빠진다"는 직관이 무너지는 지점이 존재한다</text>
</svg>
