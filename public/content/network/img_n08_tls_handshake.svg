<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="780" height="380" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 2. TLS Handshake 흐름</text>

  <rect x="60" y="50" width="130" height="40" rx="8" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="125" y="75" text-anchor="middle" font-size="13" fill="#2e7d32">클라이언트</text>
  <line x1="125" y1="90" x2="125" y2="350" stroke="#ccc" stroke-width="1.3"/>

  <rect x="590" y="50" width="130" height="40" rx="8" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="655" y="75" text-anchor="middle" font-size="13" fill="#1a73a8">서버</text>
  <line x1="655" y1="90" x2="655" y2="350" stroke="#ccc" stroke-width="1.3"/>

  <line x1="125" y1="120" x2="650" y2="120" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrowT)"/>
  <text x="390" y="112" text-anchor="middle" font-size="11.5" fill="#2e7d32">① ClientHello (지원 암호화 스위트)</text>

  <line x1="655" y1="160" x2="130" y2="160" stroke="#1a73a8" stroke-width="1.8" marker-end="url(#arrowT2)"/>
  <text x="390" y="152" text-anchor="middle" font-size="11.5" fill="#1a73a8">② ServerHello + 인증서(공개키)</text>

  <rect x="270" y="180" width="240" height="30" rx="6" fill="#fff7e6" stroke="#b8860b"/>
  <text x="390" y="200" text-anchor="middle" font-size="11" fill="#8a6d00">③ 클라이언트가 인증서 검증(CA)</text>

  <line x1="125" y1="240" x2="650" y2="240" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrowT)"/>
  <text x="390" y="232" text-anchor="middle" font-size="11.5" fill="#2e7d32">④ 공개키로 암호화한 키 교환 값 전달</text>

  <rect x="230" y="260" width="320" height="30" rx="6" fill="#f3e8fb" stroke="#7b3fa0"/>
  <text x="390" y="280" text-anchor="middle" font-size="11" fill="#7b3fa0">⑤ 양쪽 모두 대칭키(세션 키) 생성</text>

  <line x1="125" y1="320" x2="650" y2="320" stroke="#333" stroke-width="2.2" marker-end="url(#arrowT3)" marker-start="url(#arrowT3s)"/>
  <text x="390" y="312" text-anchor="middle" font-size="11.5" fill="#333" font-weight="700">⑥ 대칭키로 암호화된 통신 시작</text>

  <defs>
    <marker id="arrowT" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowT2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a73a8"/>
    </marker>
    <marker id="arrowT3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
    <marker id="arrowT3s" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
