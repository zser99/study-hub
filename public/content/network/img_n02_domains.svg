<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 2. 허브 vs 스위치 — 충돌 도메인 비교</text>

  <text x="220" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">허브 (1계층)</text>
  <rect x="80" y="70" width="280" height="180" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="220" y="90" text-anchor="middle" font-size="11" fill="#c0392b">충돌 도메인 1개 (전체 공유)</text>
  <circle cx="130" cy="130" r="18" fill="#fff" stroke="#c0392b"/>
  <circle cx="220" cy="130" r="18" fill="#fff" stroke="#c0392b"/>
  <circle cx="310" cy="130" r="18" fill="#fff" stroke="#c0392b"/>
  <circle cx="130" cy="210" r="18" fill="#fff" stroke="#c0392b"/>
  <circle cx="220" cy="210" r="18" fill="#fff" stroke="#c0392b"/>
  <circle cx="310" cy="210" r="18" fill="#fff" stroke="#c0392b"/>
  <rect x="200" y="160" width="40" height="20" fill="#c0392b"/>
  <text x="220" y="174" text-anchor="middle" font-size="9" fill="#fff">HUB</text>

  <text x="680" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a73a8">스위치 (2계층)</text>
  <rect x="540" y="70" width="280" height="180" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.3"/>
  <circle cx="590" cy="130" r="18" fill="#e8f1fb" stroke="#1a73a8"/>
  <circle cx="680" cy="130" r="18" fill="#e8f1fb" stroke="#1a73a8"/>
  <circle cx="770" cy="130" r="18" fill="#e8f1fb" stroke="#1a73a8"/>
  <circle cx="590" cy="210" r="18" fill="#e8f1fb" stroke="#1a73a8"/>
  <circle cx="680" cy="210" r="18" fill="#e8f1fb" stroke="#1a73a8"/>
  <circle cx="770" cy="210" r="18" fill="#e8f1fb" stroke="#1a73a8"/>
  <rect x="660" y="160" width="40" height="20" fill="#1a73a8"/>
  <text x="680" y="174" text-anchor="middle" font-size="9" fill="#fff">SW</text>
  <ellipse cx="590" cy="130" rx="26" ry="26" fill="none" stroke="#1a73a8" stroke-dasharray="3,2"/>
  <ellipse cx="680" cy="130" rx="26" ry="26" fill="none" stroke="#1a73a8" stroke-dasharray="3,2"/>
  <ellipse cx="770" cy="130" rx="26" ry="26" fill="none" stroke="#1a73a8" stroke-dasharray="3,2"/>
  <ellipse cx="590" cy="210" rx="26" ry="26" fill="none" stroke="#1a73a8" stroke-dasharray="3,2"/>
  <ellipse cx="680" cy="210" rx="26" ry="26" fill="none" stroke="#1a73a8" stroke-dasharray="3,2"/>
  <ellipse cx="770" cy="210" rx="26" ry="26" fill="none" stroke="#1a73a8" stroke-dasharray="3,2"/>
  <text x="680" y="90" text-anchor="middle" font-size="11" fill="#1a73a8">충돌 도메인 = 포트마다 별도(점선 원)</text>

  <rect x="150" y="270" width="600" height="55" rx="8" fill="#fff7e6" stroke="#b8860b"/>
  <text x="450" y="292" text-anchor="middle" font-size="12.5" fill="#8a6d00" font-weight="700">브로드캐스트 도메인은 허브·스위치 둘 다 "전체가 하나"</text>
  <text x="450" y="310" text-anchor="middle" font-size="11.5" fill="#8a6d00">→ 나누려면 3계층 장비(라우터)가 필요하다</text>
</svg>
