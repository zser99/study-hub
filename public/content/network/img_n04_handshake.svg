<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="780" height="320" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. TCP 3-way Handshake</text>

  <rect x="60" y="55" width="130" height="40" rx="8" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="125" y="80" text-anchor="middle" font-size="13" fill="#2e7d32">클라이언트</text>
  <line x1="125" y1="95" x2="125" y2="290" stroke="#ccc" stroke-width="1.3"/>

  <rect x="590" y="55" width="130" height="40" rx="8" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="655" y="80" text-anchor="middle" font-size="13" fill="#1a73a8">서버</text>
  <line x1="655" y1="95" x2="655" y2="290" stroke="#ccc" stroke-width="1.3"/>

  <line x1="125" y1="130" x2="650" y2="130" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowH)"/>
  <text x="390" y="122" text-anchor="middle" font-size="12.5" fill="#2e7d32">① SYN (seq=x)</text>

  <line x1="655" y1="180" x2="130" y2="180" stroke="#1a73a8" stroke-width="2" marker-end="url(#arrowH2)"/>
  <text x="390" y="172" text-anchor="middle" font-size="12.5" fill="#1a73a8">② SYN + ACK (seq=y, ack=x+1)</text>

  <line x1="125" y1="230" x2="650" y2="230" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowH)"/>
  <text x="390" y="222" text-anchor="middle" font-size="12.5" fill="#2e7d32">③ ACK (ack=y+1)</text>

  <text x="390" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#b8860b">→ 연결 성립, 이제부터 데이터 전송 가능</text>

  <defs>
    <marker id="arrowH" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowH2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a73a8"/>
    </marker>
  </defs>
</svg>
