<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="900" height="200" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 이더넷 프레임 구조</text>

  <g font-size="11.5">
    <rect x="30" y="60" width="140" height="60" fill="#e8f1fb" stroke="#1a73a8"/>
    <text x="100" y="86" text-anchor="middle" fill="#1a73a8">목적지 MAC</text>
    <text x="100" y="103" text-anchor="middle" fill="#555" font-size="10">6바이트</text>

    <rect x="170" y="60" width="140" height="60" fill="#eef7ee" stroke="#2e7d32"/>
    <text x="240" y="86" text-anchor="middle" fill="#2e7d32">출발지 MAC</text>
    <text x="240" y="103" text-anchor="middle" fill="#555" font-size="10">6바이트</text>

    <rect x="310" y="60" width="90" height="60" fill="#fff7e6" stroke="#b8860b"/>
    <text x="355" y="86" text-anchor="middle" fill="#8a6d00">타입</text>
    <text x="355" y="103" text-anchor="middle" fill="#555" font-size="10">2바이트</text>

    <rect x="400" y="60" width="360" height="60" fill="#f3e8fb" stroke="#7b3fa0"/>
    <text x="580" y="86" text-anchor="middle" fill="#7b3fa0">데이터 (IP 패킷)</text>
    <text x="580" y="103" text-anchor="middle" fill="#555" font-size="10">46~1500바이트</text>

    <rect x="760" y="60" width="110" height="60" fill="#fdecea" stroke="#c0392b"/>
    <text x="815" y="86" text-anchor="middle" fill="#c0392b">FCS</text>
    <text x="815" y="103" text-anchor="middle" fill="#555" font-size="10">4바이트</text>
  </g>

  <text x="355" y="145" text-anchor="middle" font-size="12" fill="#8a6d00">타입 필드 = "안에 뭐가 들었는지" 알려주는 이정표 (예: 0x0800 → IPv4)</text>
  <text x="580" y="168" text-anchor="middle" font-size="12" fill="#555">이더넷은 타입만 확인할 뿐, 데이터 내용은 열어보지 않는다</text>
</svg>
