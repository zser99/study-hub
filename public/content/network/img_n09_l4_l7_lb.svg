<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. L4 vs L7 로드밸런싱</text>

  <text x="220" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">L4 로드밸런서</text>
  <circle cx="60" cy="110" r="22" fill="#333"/>
  <text x="60" y="115" text-anchor="middle" font-size="9.5" fill="#fff">Client</text>
  <rect x="150" y="90" width="140" height="40" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="220" y="115" text-anchor="middle" font-size="11" fill="#c0392b">IP+포트만 확인</text>
  <circle cx="360" cy="80" r="20" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="360" y="84" text-anchor="middle" font-size="9" fill="#2e7d32">서버1</text>
  <circle cx="360" cy="140" r="20" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="360" y="144" text-anchor="middle" font-size="9" fill="#2e7d32">서버2</text>
  <g stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrowLb)">
    <line x1="82" y1="110" x2="145" y2="110"/>
    <line x1="290" y1="105" x2="342" y2="85"/>
    <line x1="290" y1="115" x2="342" y2="135"/>
  </g>
  <text x="220" y="170" text-anchor="middle" font-size="10.5" fill="#555">내용 몰라도 됨 → 빠름</text>

  <text x="680" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a73a8">L7 로드밸런서</text>
  <circle cx="520" cy="110" r="22" fill="#333"/>
  <text x="520" y="115" text-anchor="middle" font-size="9.5" fill="#fff">Client</text>
  <rect x="610" y="80" width="150" height="60" rx="8" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="685" y="102" text-anchor="middle" font-size="10.5" fill="#1a73a8">URL/헤더/쿠키 확인</text>
  <text x="685" y="120" text-anchor="middle" font-size="9.5" fill="#1a73a8">/api → A, /admin → B</text>
  <circle cx="830" cy="70" r="20" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="830" y="74" text-anchor="middle" font-size="9" fill="#2e7d32">A군</text>
  <circle cx="830" cy="150" r="20" fill="#f3e8fb" stroke="#7b3fa0"/>
  <text x="830" y="154" text-anchor="middle" font-size="9" fill="#7b3fa0">B군</text>
  <g stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrowLb)">
    <line x1="542" y1="110" x2="605" y2="110"/>
    <line x1="760" y1="95" x2="812" y2="75"/>
    <line x1="760" y1="125" x2="812" y2="145"/>
  </g>
  <text x="685" y="185" text-anchor="middle" font-size="10.5" fill="#555">내용 기반 정교한 라우팅 → 느림</text>

  <rect x="150" y="230" width="600" height="55" rx="8" fill="#f7f9fc" stroke="#ccc"/>
  <text x="450" y="252" text-anchor="middle" font-size="12" fill="#555">L4 스위치·라우터·로드밸런서의 "숫자"는 전부 OSI 계층 번호(1편 참고)</text>
  <text x="450" y="270" text-anchor="middle" font-size="12" fill="#555">숫자가 클수록 더 상위 계층(더 많은 내용)을 이해해야 한다</text>

  <defs>
    <marker id="arrowLb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
