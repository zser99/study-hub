<svg viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="880" height="320" fill="#ffffff"/>
  <text x="440" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 2. CDN — 엣지 서버로 물리적 거리 줄이기</text>

  <circle cx="440" cy="160" r="45" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="440" y="155" text-anchor="middle" font-size="11" fill="#8a6d00" font-weight="700">오리진</text>
  <text x="440" y="172" text-anchor="middle" font-size="10" fill="#8a6d00">(원본 서버)</text>

  <circle cx="150" cy="90" r="30" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="150" y="86" text-anchor="middle" font-size="9.5" fill="#1a73a8">엣지</text>
  <text x="150" y="100" text-anchor="middle" font-size="9" fill="#1a73a8">(서울)</text>
  <circle cx="90" cy="90" r="16" fill="#333"/>
  <text x="90" y="94" text-anchor="middle" font-size="8" fill="#fff">사용자</text>

  <circle cx="730" cy="90" r="30" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="730" y="86" text-anchor="middle" font-size="9.5" fill="#1a73a8">엣지</text>
  <text x="730" y="100" text-anchor="middle" font-size="9" fill="#1a73a8">(도쿄)</text>
  <circle cx="790" cy="90" r="16" fill="#333"/>
  <text x="790" y="94" text-anchor="middle" font-size="8" fill="#fff">사용자</text>

  <circle cx="150" cy="250" r="30" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="150" y="246" text-anchor="middle" font-size="9.5" fill="#1a73a8">엣지</text>
  <text x="150" y="260" text-anchor="middle" font-size="9" fill="#1a73a8">(뉴욕)</text>
  <circle cx="90" cy="250" r="16" fill="#333"/>
  <text x="90" y="254" text-anchor="middle" font-size="8" fill="#fff">사용자</text>

  <g stroke="#2e7d32" stroke-width="1.6" fill="none">
    <line x1="106" y1="90" x2="122" y2="90"/>
    <line x1="106" y1="250" x2="122" y2="250"/>
    <line x1="763" y1="90" x2="775" y2="90"/>
  </g>
  <g stroke="#999" stroke-width="1.3" stroke-dasharray="4,3" fill="none">
    <line x1="178" y1="100" x2="400" y2="145"/>
    <line x1="178" y1="240" x2="400" y2="175"/>
    <line x1="702" y1="100" x2="480" y2="145"/>
  </g>

  <text x="440" y="260" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="700">캐시 히트: 엣지가 바로 응답 (오리진까지 안 감)</text>
  <text x="440" y="280" text-anchor="middle" font-size="11.5" fill="#999">캐시 미스: 엣지 → 오리진 요청 → 응답하며 캐싱(점선)</text>
  <text x="440" y="300" text-anchor="middle" font-size="11.5" fill="#555">GeoDNS가 사용자 위치에 따라 가장 가까운 엣지의 IP를 응답</text>
</svg>
