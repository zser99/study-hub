<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 2. DNS 리졸빙 흐름</text>

  <circle cx="50" cy="150" r="28" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="50" y="155" text-anchor="middle" font-size="10.5" fill="#2e7d32">클라이언트</text>

  <rect x="150" y="120" width="120" height="60" rx="8" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="210" y="145" text-anchor="middle" font-size="11" fill="#1a73a8">재귀적 리졸버</text>
  <text x="210" y="163" text-anchor="middle" font-size="9.5" fill="#555">(8.8.8.8 등)</text>

  <rect x="380" y="40" width="110" height="45" rx="6" fill="#333"/>
  <text x="435" y="67" text-anchor="middle" font-size="10.5" fill="#fff">① 루트 서버</text>

  <rect x="380" y="140" width="110" height="45" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="435" y="167" text-anchor="middle" font-size="10.5" fill="#c0392b">② TLD 서버(.com)</text>

  <rect x="380" y="230" width="110" height="45" rx="6" fill="#fff7e6" stroke="#b8860b"/>
  <text x="435" y="257" text-anchor="middle" font-size="10.5" fill="#8a6d00">③ 권한 서버</text>

  <g stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrowD)">
    <line x1="78" y1="145" x2="145" y2="140"/>
    <line x1="270" y1="135" x2="375" y2="65"/>
    <line x1="270" y1="150" x2="375" y2="160"/>
    <line x1="270" y1="165" x2="375" y2="248"/>
  </g>

  <text x="680" y="90" font-size="11" fill="#555">① "example.com 몰라, .com 서버한테 물어봐"</text>
  <text x="680" y="150" font-size="11" fill="#555">② "몰라, example.com 권한 서버한테 물어봐"</text>
  <text x="680" y="210" font-size="11" fill="#555">③ "www.example.com = 93.184.x.x"</text>

  <rect x="130" y="270" width="640" height="24" fill="#f7f9fc"/>
  <text x="450" y="287" text-anchor="middle" font-size="11.5" fill="#555">클라이언트-리졸버: 재귀적 질의 · 리졸버-①②③: 반복적 질의</text>

  <defs>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
