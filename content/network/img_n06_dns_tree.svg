<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="780" height="260" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 도메인 이름의 계층 구조</text>

  <circle cx="390" cy="60" r="22" fill="#333"/>
  <text x="390" y="65" text-anchor="middle" font-size="11" fill="#fff">루트(.)</text>

  <circle cx="220" cy="130" r="26" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="220" y="135" text-anchor="middle" font-size="11" fill="#1a73a8">.com</text>
  <circle cx="390" cy="130" r="26" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="390" y="135" text-anchor="middle" font-size="11" fill="#1a73a8">.org</text>
  <circle cx="560" cy="130" r="26" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="560" y="135" text-anchor="middle" font-size="11" fill="#1a73a8">.kr</text>

  <circle cx="220" cy="200" r="30" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="220" y="205" text-anchor="middle" font-size="10.5" fill="#2e7d32">example.com</text>

  <rect x="150" y="230" width="140" height="26" rx="6" fill="#fff7e6" stroke="#b8860b"/>
  <text x="220" y="248" text-anchor="middle" font-size="10.5" fill="#8a6d00">www.example.com</text>

  <g stroke="#999" stroke-width="1.3" fill="none">
    <line x1="390" y1="82" x2="220" y2="106"/>
    <line x1="390" y1="82" x2="390" y2="106"/>
    <line x1="390" y1="82" x2="560" y2="106"/>
    <line x1="220" y1="156" x2="220" y2="172"/>
    <line x1="220" y1="228" x2="220" y2="230"/>
  </g>

  <text x="390" y="248" text-anchor="middle" font-size="11.5" fill="#555">TLD → 2차 도메인 → 서브도메인, 오른쪽에서 왼쪽으로 갈수록 구체적</text>
</svg>
