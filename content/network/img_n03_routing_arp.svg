<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 2. 라우터를 거칠 때마다 바뀌는 MAC, 유지되는 IP</text>

  <circle cx="60" cy="120" r="30" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="60" y="125" text-anchor="middle" font-size="11" fill="#2e7d32">PC A</text>

  <rect x="220" y="95" width="90" height="50" rx="8" fill="#fff7e6" stroke="#b8860b"/>
  <text x="265" y="125" text-anchor="middle" font-size="11" fill="#8a6d00">라우터 1</text>

  <rect x="480" y="95" width="90" height="50" rx="8" fill="#fff7e6" stroke="#b8860b"/>
  <text x="525" y="125" text-anchor="middle" font-size="11" fill="#8a6d00">라우터 2</text>

  <circle cx="880" cy="120" r="30" fill="#f3e8fb" stroke="#7b3fa0" stroke-width="1.5"/>
  <text x="880" y="125" text-anchor="middle" font-size="11" fill="#7b3fa0">서버</text>

  <g stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrowR)">
    <line x1="90" y1="120" x2="215" y2="120"/>
    <line x1="310" y1="120" x2="475" y2="120"/>
    <line x1="570" y1="120" x2="850" y2="120"/>
  </g>

  <g font-size="10.5">
    <text x="150" y="105" text-anchor="middle" fill="#1a73a8">IP: A→서버</text>
    <text x="150" y="150" text-anchor="middle" fill="#c0392b">MAC: A→R1</text>

    <text x="390" y="105" text-anchor="middle" fill="#1a73a8">IP: A→서버 (유지)</text>
    <text x="390" y="150" text-anchor="middle" fill="#c0392b">MAC: R1→R2 (변경)</text>

    <text x="710" y="105" text-anchor="middle" fill="#1a73a8">IP: A→서버 (유지)</text>
    <text x="710" y="150" text-anchor="middle" fill="#c0392b">MAC: R2→서버 (변경)</text>
  </g>

  <rect x="130" y="200" width="700" height="70" rx="8" fill="#f7f9fc" stroke="#ccc"/>
  <text x="480" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#1a73a8">IP 주소 = 최종 목적지 (변하지 않음)</text>
  <text x="480" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">MAC 주소 = 다음 한 걸음 (홉마다 갱신됨, ARP로 알아냄)</text>

  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
