<svg viewBox="0 0 860 280" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="860" height="280" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 대칭키 vs 비대칭키</text>

  <text x="210" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">대칭키</text>
  <circle cx="110" cy="120" r="28" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="110" y="125" text-anchor="middle" font-size="10.5" fill="#2e7d32">송신자</text>
  <circle cx="310" cy="120" r="28" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="310" y="125" text-anchor="middle" font-size="10.5" fill="#2e7d32">수신자</text>
  <line x1="138" y1="120" x2="282" y2="120" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowS)" marker-start="url(#arrowS)"/>
  <text x="210" y="105" text-anchor="middle" font-size="11" fill="#2e7d32">같은 키 🔑 사용</text>
  <text x="210" y="175" text-anchor="middle" font-size="11" fill="#555">빠르다 / 키를 어떻게 안전하게</text>
  <text x="210" y="193" text-anchor="middle" font-size="11" fill="#555">전달하느냐가 문제</text>

  <text x="650" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a73a8">비대칭키(공개키)</text>
  <circle cx="550" cy="120" r="28" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="550" y="125" text-anchor="middle" font-size="10.5" fill="#1a73a8">송신자</text>
  <circle cx="750" cy="120" r="28" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="750" y="125" text-anchor="middle" font-size="10.5" fill="#1a73a8">수신자</text>
  <line x1="578" y1="115" x2="722" y2="115" stroke="#1a73a8" stroke-width="2" marker-end="url(#arrowP)"/>
  <text x="650" y="100" text-anchor="middle" font-size="10.5" fill="#1a73a8">공개키로 암호화 (누구나 가능)</text>
  <line x1="722" y1="130" x2="578" y2="130" stroke="#c0392b" stroke-width="0" />
  <text x="650" y="175" text-anchor="middle" font-size="11" fill="#555">개인키를 가진 수신자만 복호화 가능</text>
  <text x="650" y="193" text-anchor="middle" font-size="11" fill="#555">느리지만 키 교환 문제 없음</text>

  <defs>
    <marker id="arrowS" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a73a8"/>
    </marker>
  </defs>
</svg>
