<svg viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrowDl" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="780" height="340" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 2. 데드락 — 순환 대기(Circular Wait)</text>

  <circle cx="200" cy="140" r="40" fill="#e8f1fb" stroke="#1a73a8" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1a73a8">프로세스 A</text>

  <circle cx="580" cy="140" r="40" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="580" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">프로세스 B</text>

  <rect x="355" y="60" width="70" height="34" rx="4" fill="#fff7e6" stroke="#b8860b"/>
  <text x="390" y="82" text-anchor="middle" font-size="11" fill="#8a6d00">자원 1</text>

  <rect x="355" y="210" width="70" height="34" rx="4" fill="#fff7e6" stroke="#b8860b"/>
  <text x="390" y="232" text-anchor="middle" font-size="11" fill="#8a6d00">자원 2</text>

  <line x1="355" y1="72" x2="245" y2="125" stroke="#1a73a8" stroke-width="2"/>
  <text x="280" y="90" font-size="9.5" fill="#1a73a8">점유</text>

  <line x1="240" y1="160" x2="360" y2="225" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowDl)"/>
  <text x="270" y="210" font-size="9.5" fill="#c0392b">대기</text>

  <line x1="425" y1="225" x2="545" y2="160" stroke="#2e7d32" stroke-width="2"/>
  <text x="500" y="210" font-size="9.5" fill="#2e7d32">점유</text>

  <line x1="540" y1="125" x2="420" y2="75" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowDl)"/>
  <text x="500" y="90" font-size="9.5" fill="#c0392b">대기</text>

  <text x="390" y="290" text-anchor="middle" font-size="12" fill="#555">A는 자원 1을 쥔 채 자원 2를 기다리고, B는 자원 2를 쥔 채 자원 1을 기다린다</text>
  <text x="390" y="310" text-anchor="middle" font-size="12.5" fill="#c0392b" font-weight="700">상호 배제 · 점유 대기 · 비선점 · 순환 대기 — 네 조건이 모두 성립하면 영원히 풀리지 않는다</text>
</svg>
