<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrowPg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1a73a8"/>
    </marker>
  </defs>
  <rect width="820" height="340" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 가상 주소 → 물리 주소 변환 (페이징)</text>

  <text x="130" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#333">가상 주소</text>
  <rect x="60" y="65" width="80" height="34" fill="#e8f1fb" stroke="#1a73a8"/><text x="100" y="87" text-anchor="middle" font-size="10" fill="#1a73a8">페이지 #2</text>
  <rect x="140" y="65" width="80" height="34" fill="#fff7e6" stroke="#b8860b"/><text x="180" y="87" text-anchor="middle" font-size="10" fill="#8a6d00">오프셋 120</text>

  <text x="330" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#333">페이지 테이블 (프로세스 A)</text>
  <rect x="240" y="65" width="180" height="130" fill="#fff" stroke="#999"/>
  <line x1="240" y1="98" x2="420" y2="98" stroke="#ccc"/>
  <line x1="330" y1="65" x2="330" y2="195" stroke="#ccc"/>
  <text x="285" y="80" text-anchor="middle" font-size="9.5" fill="#555">페이지#</text>
  <text x="375" y="80" text-anchor="middle" font-size="9.5" fill="#555">프레임#</text>
  <text x="285" y="93" text-anchor="middle" font-size="9.5" fill="#555">0</text>
  <text x="375" y="93" text-anchor="middle" font-size="9.5" fill="#555">7</text>
  <rect x="240" y="98" width="180" height="30" fill="#e8f1fb"/>
  <text x="285" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#1a73a8">2</text>
  <text x="375" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#1a73a8">5</text>
  <line x1="240" y1="128" x2="420" y2="128" stroke="#ccc"/>
  <text x="285" y="145" text-anchor="middle" font-size="9.5" fill="#555">3</text>
  <text x="375" y="145" text-anchor="middle" font-size="9.5" fill="#555">1</text>
  <line x1="240" y1="160" x2="420" y2="160" stroke="#ccc"/>
  <text x="285" y="178" text-anchor="middle" font-size="9.5" fill="#555">4</text>
  <text x="375" y="178" text-anchor="middle" font-size="9.5" fill="#555">3</text>

  <line x1="100" y1="99" x2="100" y2="230" stroke="#1a73a8" stroke-dasharray="3,3"/>
  <line x1="100" y1="230" x2="285" y2="113" stroke="#1a73a8" stroke-dasharray="3,3" marker-end="url(#arrowPg)"/>
  <text x="150" y="230" font-size="9.5" fill="#1a73a8">MMU가 조회</text>

  <line x1="375" y1="113" x2="620" y2="113" stroke="#1a73a8" marker-end="url(#arrowPg)"/>

  <text x="640" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#333">물리 메모리 (프레임)</text>
  <rect x="560" y="65" width="160" height="200" fill="#fff" stroke="#999"/>
  <rect x="560" y="65" width="160" height="25" fill="#f5f5f5"/><text x="640" y="82" text-anchor="middle" font-size="9" fill="#777">프레임 0~4</text>
  <rect x="560" y="90" width="160" height="25" fill="#eef7ee" stroke="#2e7d32"/><text x="640" y="107" text-anchor="middle" font-size="9.5" fill="#2e7d32">프레임 5 ← 여기!</text>
  <rect x="560" y="115" width="160" height="150" fill="#f5f5f5"/><text x="640" y="195" text-anchor="middle" font-size="9" fill="#777">프레임 6~N</text>

  <rect x="180" y="230" width="220" height="40" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="290" y="254" text-anchor="middle" font-size="10.5" fill="#c0392b">오프셋(120)은 그대로, 프레임 번호만 바뀐다</text>

  <text x="410" y="300" text-anchor="middle" font-size="12" fill="#555">가상 주소 = 페이지 번호 + 오프셋 → 페이지 테이블 조회 → 프레임 번호 + 오프셋 = 물리 주소</text>
  <text x="410" y="320" text-anchor="middle" font-size="11" fill="#777">프로세스마다 페이지 테이블이 따로 있어, 같은 가상 주소도 서로 다른 프레임을 가리킨다</text>
</svg>
