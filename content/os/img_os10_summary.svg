<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 2. 운영체제 시리즈 전체 개념 지도 (1~10편)</text>

  <rect x="30" y="55" width="240" height="60" rx="6" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="150" y="78" text-anchor="middle" font-size="10.5" fill="#1a73a8" font-weight="700">1편 OS 개요</text>
  <text x="150" y="96" text-anchor="middle" font-size="9" fill="#1a73a8">커널모드/시스템콜/트랩</text>

  <rect x="300" y="55" width="240" height="60" rx="6" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="420" y="78" text-anchor="middle" font-size="10.5" fill="#1a73a8" font-weight="700">2편 프로세스·스레드</text>
  <text x="420" y="96" text-anchor="middle" font-size="9" fill="#1a73a8">PCB/상태전이/컨텍스트스위칭</text>

  <rect x="570" y="55" width="240" height="60" rx="6" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="690" y="78" text-anchor="middle" font-size="10.5" fill="#1a73a8" font-weight="700">3편 CPU 스케줄링</text>
  <text x="690" y="96" text-anchor="middle" font-size="9" fill="#1a73a8">FCFS/SJF/RR/우선순위</text>

  <rect x="30" y="140" width="240" height="60" rx="6" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="150" y="163" text-anchor="middle" font-size="10.5" fill="#2e7d32" font-weight="700">4편 프로세스 동기화</text>
  <text x="150" y="181" text-anchor="middle" font-size="9" fill="#2e7d32">뮤텍스/세마포어/데드락</text>

  <rect x="300" y="140" width="240" height="60" rx="6" fill="#fff7e6" stroke="#b8860b"/>
  <text x="420" y="163" text-anchor="middle" font-size="10.5" fill="#8a6d00" font-weight="700">5편 가상 메모리</text>
  <text x="420" y="181" text-anchor="middle" font-size="9" fill="#8a6d00">페이징/세그멘테이션/폴트</text>

  <rect x="570" y="140" width="240" height="60" rx="6" fill="#fff7e6" stroke="#b8860b"/>
  <text x="690" y="163" text-anchor="middle" font-size="10.5" fill="#8a6d00" font-weight="700">6편 메모리 심화</text>
  <text x="690" y="181" text-anchor="middle" font-size="9" fill="#8a6d00">FIFO/LRU/스와핑/스래싱</text>

  <rect x="30" y="225" width="240" height="60" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="150" y="248" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="700">7편 파일 시스템</text>
  <text x="150" y="266" text-anchor="middle" font-size="9" fill="#c0392b">inode/디스크스케줄링</text>

  <rect x="300" y="225" width="240" height="60" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="420" y="248" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="700">8편 입출력 관리</text>
  <text x="420" y="266" text-anchor="middle" font-size="9" fill="#c0392b">인터럽트/DMA/버퍼링·캐싱</text>

  <rect x="570" y="225" width="240" height="60" rx="6" fill="#f3e8fb" stroke="#7b3fa0"/>
  <text x="690" y="248" text-anchor="middle" font-size="10.5" fill="#7b3fa0" font-weight="700">9편 가상화·컨테이너</text>
  <text x="690" y="266" text-anchor="middle" font-size="9" fill="#7b3fa0">VM/네임스페이스/cgroup</text>

  <rect x="240" y="330" width="380" height="60" rx="6" fill="#333" stroke="#333"/>
  <text x="430" y="353" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="700">10편 실전 진단</text>
  <text x="430" y="373" text-anchor="middle" font-size="9.5" fill="#eee">top/ps/vmstat/iostat — 모든 개념이 명령어 출력에 그대로 나타난다</text>
</svg>
