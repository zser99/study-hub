<svg viewBox="0 0 780 260" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="780" height="260" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 2. 에이징 — 오래 기다릴수록 우선순위가 오른다</text>

  <line x1="80" y1="200" x2="700" y2="200" stroke="#999" stroke-width="1.3"/>
  <line x1="80" y1="200" x2="80" y2="50" stroke="#999" stroke-width="1.3"/>
  <text x="60" y="55" font-size="10.5" fill="#555">우선순위</text>
  <text x="700" y="218" font-size="10.5" fill="#555">대기 시간</text>

  <path d="M80,190 L200,180 L320,150 L440,110 L560,70 L680,55" fill="none" stroke="#1a73a8" stroke-width="2.2"/>
  <circle cx="80" cy="190" r="4" fill="#1a73a8"/>
  <circle cx="680" cy="55" r="4" fill="#1a73a8"/>
  <text x="130" y="205" text-anchor="middle" font-size="10" fill="#c0392b">낮은 우선순위로 시작</text>
  <text x="640" y="45" text-anchor="middle" font-size="10" fill="#2e7d32">결국 실행 기회를 얻는다</text>

  <text x="390" y="240" text-anchor="middle" font-size="12.5" fill="#555">기아 상태(starvation)를 막기 위해, 오래 기다린 프로세스의 우선순위를 점진적으로 높여준다</text>
</svg>
