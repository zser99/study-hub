<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrowTc" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="820" height="340" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. "서버가 느려요" — 진단 순서</text>

  <rect x="30" y="60" width="150" height="56" rx="6" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="105" y="82" text-anchor="middle" font-size="10.5" fill="#1a73a8" font-weight="700">① top</text>
  <text x="105" y="100" text-anchor="middle" font-size="9" fill="#1a73a8">load average 확인</text>

  <rect x="215" y="60" width="150" height="56" rx="6" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="290" y="82" text-anchor="middle" font-size="10.5" fill="#2e7d32" font-weight="700">② ps</text>
  <text x="290" y="100" text-anchor="middle" font-size="9" fill="#2e7d32">D 상태 프로세스 확인</text>

  <rect x="400" y="60" width="150" height="56" rx="6" fill="#fff7e6" stroke="#b8860b"/>
  <text x="475" y="82" text-anchor="middle" font-size="10.5" fill="#8a6d00" font-weight="700">③ vmstat</text>
  <text x="475" y="100" text-anchor="middle" font-size="9" fill="#8a6d00">si/so 스와핑 확인</text>

  <rect x="585" y="60" width="150" height="56" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="660" y="82" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="700">④ iostat</text>
  <text x="660" y="100" text-anchor="middle" font-size="9" fill="#c0392b">%util, await 확인</text>

  <line x1="180" y1="88" x2="211" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#arrowTc)"/>
  <line x1="365" y1="88" x2="396" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#arrowTc)"/>
  <line x1="550" y1="88" x2="581" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#arrowTc)"/>

  <rect x="60" y="150" width="700" height="130" rx="8" fill="#f9f9f9" stroke="#ccc"/>
  <text x="410" y="172" text-anchor="middle" font-size="11.5" fill="#333" font-weight="700">CPU 사용률 높음 → 어떤 프로세스가 CPU를 쓰는지 top에서 바로 확인</text>
  <text x="410" y="196" text-anchor="middle" font-size="11.5" fill="#333">CPU는 한가한데 load만 높음 → ps에서 D 상태 많으면 입출력 병목 의심</text>
  <text x="410" y="220" text-anchor="middle" font-size="11.5" fill="#333">si/so 값이 지속적으로 큼 → 메모리 부족, 스래싱 진행 중일 가능성</text>
  <text x="410" y="244" text-anchor="middle" font-size="11.5" fill="#333">%util 100%에 근접 → 디스크 자체가 병목, 스케줄링/하드웨어 점검 필요</text>
  <text x="410" y="268" text-anchor="middle" font-size="10.5" fill="#777">CPU → 프로세스 상태 → 메모리 → 디스크 순으로 좁혀나간다</text>
</svg>
