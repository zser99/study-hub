<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrowRl" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="820" height="340" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 역할별로 분리된 Gateway API 리소스</text>

  <rect x="40" y="60" width="220" height="90" rx="8" fill="#e8f1fb" stroke="#1a73a8" stroke-width="1.5"/>
  <text x="150" y="85" text-anchor="middle" font-size="11" fill="#1a73a8" font-weight="700">인프라 제공자</text>
  <text x="150" y="105" text-anchor="middle" font-size="9" fill="#1a73a8">여러 클러스터·테넌트를</text>
  <text x="150" y="120" text-anchor="middle" font-size="9" fill="#1a73a8">아우르는 인프라 전체 관리</text>
  <text x="150" y="138" text-anchor="middle" font-size="10" fill="#1a73a8" font-weight="700">→ GatewayClass</text>

  <rect x="300" y="60" width="220" height="90" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="410" y="85" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="700">클러스터 운영자</text>
  <text x="410" y="105" text-anchor="middle" font-size="9" fill="#2e7d32">리스너(포트·TLS),</text>
  <text x="410" y="120" text-anchor="middle" font-size="9" fill="#2e7d32">네임스페이스 접근 통제</text>
  <text x="410" y="138" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="700">→ Gateway</text>

  <rect x="560" y="60" width="220" height="90" rx="8" fill="#f3e8fb" stroke="#7b3fa0" stroke-width="1.5"/>
  <text x="670" y="85" text-anchor="middle" font-size="11" fill="#7b3fa0" font-weight="700">애플리케이션 개발자</text>
  <text x="670" y="105" text-anchor="middle" font-size="9" fill="#7b3fa0">경로·헤더·가중치 등</text>
  <text x="670" y="120" text-anchor="middle" font-size="9" fill="#7b3fa0">실제 라우팅 규칙 정의</text>
  <text x="670" y="138" text-anchor="middle" font-size="10" fill="#7b3fa0" font-weight="700">→ HTTPRoute</text>

  <line x1="260" y1="105" x2="296" y2="105" stroke="#555" stroke-width="1.6" marker-end="url(#arrowRl)"/>
  <line x1="520" y1="105" x2="556" y2="105" stroke="#555" stroke-width="1.6" marker-end="url(#arrowRl)"/>

  <rect x="150" y="200" width="520" height="100" rx="8" fill="#f9f9f9" stroke="#ccc"/>
  <text x="410" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="700">각 역할이 자신의 관심사만 관리하고, 서로 침범하지 않는다</text>
  <text x="410" y="252" text-anchor="middle" font-size="10" fill="#555">여러 팀의 애플리케이션 개발자가 각자 HTTPRoute만 만들어</text>
  <text x="410" y="272" text-anchor="middle" font-size="10" fill="#555">클러스터 운영자가 준비해둔 하나의 Gateway에 라우트를 "붙인다"</text>

  <text x="410" y="325" text-anchor="middle" font-size="11" fill="#777">Ingress는 이 세 관심사가 하나의 오브젝트에 섞여 있었다</text>
</svg>
