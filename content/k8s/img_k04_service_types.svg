<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="860" height="380" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. Service 네 가지 타입의 계층 구조</text>

  <rect x="60" y="60" width="740" height="80" rx="8" fill="#f3e8fb" stroke="#7b3fa0"/>
  <text x="90" y="85" font-size="11" fill="#7b3fa0" font-weight="700">ExternalName</text>
  <text x="90" y="105" font-size="9.5" fill="#7b3fa0">프록시 없이 DNS CNAME만 반환 — 클러스터 외부 서비스를 내부 이름으로 참조</text>
  <text x="90" y="123" font-size="9" fill="#7b3fa0">(다른 세 타입과는 독립적인 구조)</text>

  <rect x="60" y="160" width="220" height="190" rx="8" fill="#e8f1fb" stroke="#1a73a8" stroke-width="1.5"/>
  <text x="170" y="185" text-anchor="middle" font-size="11.5" fill="#1a73a8" font-weight="700">ClusterIP (기본)</text>
  <text x="170" y="210" text-anchor="middle" font-size="9" fill="#1a73a8">클러스터 내부 전용</text>
  <text x="170" y="228" text-anchor="middle" font-size="9" fill="#1a73a8">가상 IP 하나 할당</text>
  <rect x="90" y="260" width="160" height="70" rx="6" fill="#fff" stroke="#1a73a8"/>
  <text x="170" y="290" text-anchor="middle" font-size="9" fill="#1a73a8">Pod, Pod, Pod...</text>
  <text x="170" y="308" text-anchor="middle" font-size="8.5" fill="#1a73a8">셀렉터로 연결</text>

  <rect x="320" y="160" width="240" height="190" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="440" y="185" text-anchor="middle" font-size="11.5" fill="#2e7d32" font-weight="700">NodePort</text>
  <text x="440" y="205" text-anchor="middle" font-size="9" fill="#2e7d32">ClusterIP + 모든 노드의</text>
  <text x="440" y="221" text-anchor="middle" font-size="9" fill="#2e7d32">동일 포트를 NAT로 개방</text>
  <rect x="345" y="240" width="190" height="30" fill="#fff" stroke="#2e7d32"/>
  <text x="440" y="260" text-anchor="middle" font-size="8.5" fill="#2e7d32">ClusterIP (내부에 포함)</text>
  <text x="440" y="290" text-anchor="middle" font-size="8.5" fill="#2e7d32">NodeIP:NodePort로</text>
  <text x="440" y="306" text-anchor="middle" font-size="8.5" fill="#2e7d32">외부에서 접근 가능</text>

  <rect x="600" y="160" width="220" height="190" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="710" y="185" text-anchor="middle" font-size="11.5" fill="#c0392b" font-weight="700">LoadBalancer</text>
  <text x="710" y="205" text-anchor="middle" font-size="9" fill="#c0392b">NodePort + 클라우드의</text>
  <text x="710" y="221" text-anchor="middle" font-size="9" fill="#c0392b">외부 로드밸런서 생성</text>
  <rect x="625" y="240" width="170" height="30" fill="#fff" stroke="#c0392b"/>
  <text x="710" y="260" text-anchor="middle" font-size="8.5" fill="#c0392b">NodePort (내부에 포함)</text>
  <text x="710" y="290" text-anchor="middle" font-size="8.5" fill="#c0392b">고정 외부 IP로</text>
  <text x="710" y="306" text-anchor="middle" font-size="8.5" fill="#c0392b">프로덕션 트래픽 유입</text>

  <text x="430" y="368" text-anchor="middle" font-size="11" fill="#555">ClusterIP ⊂ NodePort ⊂ LoadBalancer — 각 타입은 이전 타입 위에 기능을 얹은 것</text>
</svg>
