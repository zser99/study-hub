  <text x="450" y="122" text-anchor="middle" font-size="10.5" fill="#c0392b">느림 · 적게</text>

  <polygon points="320,140 580,140 640,225 260,225" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/>
