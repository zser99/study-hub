<svg viewBox="0 0 960 250" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="960" height="250" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 필터 · 인터셉터 · 컨트롤러의 위치</text>

  <rect x="20" y="70" width="110" height="90" rx="8" fill="#333"/>
  <text x="75" y="110" text-anchor="middle" font-size="12" fill="#fff">Client</text>
  <text x="75" y="128" text-anchor="middle" font-size="10.5" fill="#ccc">요청</text>

  <rect x="160" y="60" width="140" height="110" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="230" y="85" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b">서블릿 필터</text>
  <text x="230" y="105" text-anchor="middle" font-size="10.5" fill="#555">스프링 컨텍스트 밖</text>
  <text x="230" y="122" text-anchor="middle" font-size="10.5" fill="#555">인코딩·CORS</text>
  <text x="230" y="139" text-anchor="middle" font-size="10.5" fill="#555">핸들러 정보 모름</text>

  <rect x="330" y="30" width="600" height="180" rx="10" fill="#f7f9fc" stroke="#ccc" stroke-dasharray="3,3"/>
  <text x="630" y="50" text-anchor="middle" font-size="12" fill="#888">스프링 컨텍스트 내부</text>

  <rect x="350" y="70" width="130" height="100" rx="8" fill="#e8f1fb" stroke="#1a73a8" stroke-width="1.5"/>
  <text x="415" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#1a73a8">인터셉터</text>
  <text x="415" y="110" text-anchor="middle" font-size="10.5" fill="#555">preHandle</text>
  <text x="415" y="128" text-anchor="middle" font-size="10.5" fill="#555">핸들러 정보 O</text>
  <text x="415" y="146" text-anchor="middle" font-size="10.5" fill="#555">빈 자유롭게 사용</text>

  <rect x="510" y="70" width="150" height="100" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="585" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2e7d32">Controller</text>
  <text x="585" y="120" text-anchor="middle" font-size="10.5" fill="#555">@ExceptionHandler</text>
  <text x="585" y="138" text-anchor="middle" font-size="10.5" fill="#555">@Valid 검증</text>

  <rect x="700" y="70" width="130" height="100" rx="8" fill="#e8f1fb" stroke="#1a73a8" stroke-width="1.5"/>
  <text x="765" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#1a73a8">인터셉터</text>
  <text x="765" y="110" text-anchor="middle" font-size="10.5" fill="#555">postHandle</text>
  <text x="765" y="128" text-anchor="middle" font-size="10.5" fill="#555">afterCompletion</text>

  <g stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arrow6)">
    <line x1="130" y1="115" x2="155" y2="115"/>
    <line x1="300" y1="115" x2="345" y2="120"/>
    <line x1="480" y1="120" x2="505" y2="120"/>
    <line x1="660" y1="120" x2="695" y2="120"/>
  </g>

  <text x="480" y="235" text-anchor="middle" font-size="12.5" fill="#555">필터는 "누구인지 몰라도 되는 공통 검사", 인터셉터는 "어디로 갈지 알아야 하는 세밀한 검사"</text>

  <defs>
    <marker id="arrow6" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
