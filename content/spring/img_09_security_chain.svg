<svg viewBox="0 0 960 260" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="960" height="260" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 스프링 시큐리티 필터체인</text>

  <rect x="20" y="80" width="100" height="60" rx="8" fill="#333"/>
  <text x="70" y="115" text-anchor="middle" font-size="12" fill="#fff">Client</text>

  <rect x="150" y="80" width="150" height="60" rx="8" fill="#f3e8fb" stroke="#7b3fa0" stroke-width="1.5"/>
  <text x="225" y="105" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7b3fa0">DelegatingFilterProxy</text>
  <text x="225" y="122" text-anchor="middle" font-size="10" fill="#555">서블릿 ↔ 스프링 다리</text>

  <rect x="330" y="80" width="150" height="60" rx="8" fill="#e8f1fb" stroke="#1a73a8" stroke-width="1.5"/>
  <text x="405" y="105" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a73a8">FilterChainProxy</text>
  <text x="405" y="122" text-anchor="middle" font-size="10" fill="#555">실제 진입점</text>

  <rect x="510" y="30" width="130" height="45" rx="6" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="575" y="52" text-anchor="middle" font-size="10.5" fill="#2e7d32">인증 필터</text>
  <text x="575" y="66" text-anchor="middle" font-size="9.5" fill="#555">UsernamePasswordAuth..</text>

  <rect x="510" y="85" width="130" height="45" rx="6" fill="#fff7e6" stroke="#b8860b"/>
  <text x="575" y="106" text-anchor="middle" font-size="10.5" fill="#8a6d00">예외 처리 필터</text>
  <text x="575" y="120" text-anchor="middle" font-size="9.5" fill="#555">ExceptionTranslation..</text>

  <rect x="510" y="140" width="130" height="45" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="575" y="161" text-anchor="middle" font-size="10.5" fill="#c0392b">인가 필터</text>
  <text x="575" y="175" text-anchor="middle" font-size="9.5" fill="#555">AuthorizationFilter</text>

  <rect x="700" y="80" width="130" height="60" rx="8" fill="#333"/>
  <text x="765" y="105" text-anchor="middle" font-size="11.5" fill="#fff">DispatcherServlet</text>
  <text x="765" y="122" text-anchor="middle" font-size="10" fill="#ccc">→ Controller</text>

  <rect x="855" y="200" width="90" height="35" rx="6" fill="#e8f1fb" stroke="#1a73a8"/>
  <text x="900" y="223" text-anchor="middle" font-size="10.5" fill="#1a73a8">SecurityContext</text>

  <g stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arrow9)">
    <line x1="120" y1="110" x2="145" y2="110"/>
    <line x1="300" y1="110" x2="325" y2="110"/>
    <line x1="480" y1="110" x2="505" y2="52"/>
    <line x1="480" y1="110" x2="505" y2="107"/>
    <line x1="480" y1="110" x2="505" y2="162"/>
    <line x1="640" y1="110" x2="695" y2="110"/>
  </g>

  <text x="480" y="210" text-anchor="middle" font-size="12" fill="#555">인증 성공 시 Authentication이 SecurityContextHolder(스레드 로컬)에 저장된다</text>

  <defs>
    <marker id="arrow9" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
