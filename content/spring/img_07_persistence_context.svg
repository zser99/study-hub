<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">그림 1. 영속성 컨텍스트와 장바구니</text>

  <rect x="30" y="70" width="130" height="55" rx="10" fill="#333"/>
  <text x="95" y="102" text-anchor="middle" font-size="13" fill="#fff">애플리케이션</text>

  <rect x="230" y="55" width="420" height="150" rx="12" fill="#e8f1fb" stroke="#1a73a8" stroke-width="1.7"/>
  <text x="440" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1a73a8">영속성 컨텍스트 (장바구니)</text>

  <rect x="250" y="90" width="150" height="45" rx="8" fill="#ffffff" stroke="#1a73a8"/>
  <text x="325" y="113" text-anchor="middle" font-size="11.5" fill="#1a73a8">1차 캐시</text>
  <text x="325" y="128" text-anchor="middle" font-size="10" fill="#777">(같은 요청 = 같은 객체)</text>

  <rect x="420" y="90" width="200" height="45" rx="8" fill="#fff7e6" stroke="#b8860b"/>
  <text x="520" y="113" text-anchor="middle" font-size="11.5" fill="#8a6d00">쓰기 지연 SQL 저장소</text>
  <text x="520" y="128" text-anchor="middle" font-size="10" fill="#777">(변경 감지로 자동 채워짐)</text>

  <rect x="250" y="150" width="370" height="35" rx="8" fill="#eef7ee" stroke="#2e7d32"/>
  <text x="435" y="173" text-anchor="middle" font-size="11.5" fill="#2e7d32">담긴 엔티티들의 변경 사항 (dirty checking)</text>

  <rect x="740" y="90" width="120" height="55" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="800" y="112" text-anchor="middle" font-size="12.5" fill="#c0392b">DB</text>
  <text x="800" y="130" text-anchor="middle" font-size="11" fill="#c0392b">(계산대)</text>

  <g stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arrow7)">
    <line x1="160" y1="100" x2="225" y2="100"/>
    <line x1="650" y1="115" x2="735" y2="115"/>
  </g>

  <text x="440" y="230" text-anchor="middle" font-size="12.5" fill="#555">save()·필드 변경 → 장바구니(영속성 컨텍스트)에 담김 → 커밋(계산대)에서 SQL이 한 번에 flush</text>
  <text x="740" y="115" font-size="11" fill="#c0392b" text-anchor="middle" dy="-25">커밋 시점 flush</text>

  <defs>
    <marker id="arrow7" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
